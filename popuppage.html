<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Alert</title>
    <style>
        /* Base styles for a dark, terminal-like background */
        body {
            background-color: #0d1117;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* The Background Blur/Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* The Popup Box */
        .popup-box {
            background-color: #1a0000;
            border: 3px solid #ff0000;
            padding: 30px 50px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px #ff0000;
            animation: blink 1.5s infinite alternate;
        }

        /* Warning Text styling */
        .popup-box h1 {
            color: #ff0000;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .popup-box p {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Close Button */
        .close-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }

        .close-btn:hover {
            background-color: #b30000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Simple blinking animation for the warning box */
        @keyframes blink {
            0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            100% { border-color: #800000; box-shadow: 0 0 10px #800000; }
        }
    </style>
</head>

    <div>
