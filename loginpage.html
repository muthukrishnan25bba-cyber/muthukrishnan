<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-950 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all p-8">
        
        <!-- College Logo & Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-100 rounded-full mb-4 shadow-inner">
                <!-- REPLACE THE ICON BELOW WITH YOUR COLLEGE LOGO IMAGE -->
                <!-- Example: <img src="kprcas.jpg" alt="College Logo" class="w-16 h-16 object-contain"> -->
                <i class="fa-solid fa-graduation-cap text-4xl text-indigo-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Gemini Academy</h2>
            <p class="text-sm text-gray-500 mt-1">Sign in to access your student portal</p>
        </div>

        <!-- Login Form -->
        <form action="#" method="POST" class="space-y-6">
            
            <!-- Student/Employee ID Input -->
            <div>
                <label for="portal-id" class="block text-sm font-semibold text-gray-700 mb-2">Student / Employee ID</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="portal-id" name="portal-id" required
                        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                        placeholder="e.g., STU12345">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="text-sm font-semibold text-gray-700">Password</label>
                    <a href="#" class="text-xs font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Forgot password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                        placeholder="••••••••">
                </div>
            </div>

            <!-- Remember Me & Help -->
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-600">Remember this device</label>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Footer / Support Link -->
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-500">
                Need help? Contact the <a href="#" class="text-indigo-600 font-medium hover:underline">IT Support Desk</a>
            </p>
        </div>

    </div>

</body>
</html>
