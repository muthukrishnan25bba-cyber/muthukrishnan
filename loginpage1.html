<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Login</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#003366,#0059b3);
    }

    .login-container{
        background:#fff;
        width:350px;
        padding:30px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        text-align:center;
    }

    .logo{
        width:90px;
        height:90px;
        object-fit:contain;
        margin-bottom:15px;
    }

    h2{
        color:#003366;
        margin-bottom:20px;
    }

    .input-group{
        margin-bottom:15px;
        text-align:left;
    }

    .input-group label{
        display:block;
        margin-bottom:5px;
        color:#333;
        font-size:14px;
    }

    .input-group input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
        outline:none;
    }

    .input-group input:focus{
        border-color:#0059b3;
    }

    .login-btn{
        width:100%;
        padding:12px;
        background:#0059b3;
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
    }

    .login-btn:hover{
        background:#004080;
    }

    .footer{
        margin-top:15px;
        font-size:13px;
        color:#666;
    }
</style>
</head>
<body>

<div class="login-container">
    <img src="kprcas.jpg" alt="kprcas.jpg" class="logo">

    <h2>College Login Portal</h2>

    <form>
        <div class="input-group">
            <label>Student ID</label>
            <input type="text" placeholder="Enter Student ID" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="footer">
        © 2026 Your College Name
    </div>
</div>

</body>
</html>
