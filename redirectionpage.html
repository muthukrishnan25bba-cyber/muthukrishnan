<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <meta http-serif-refresh content="0; url=https://www.instagram.com/">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #262626;
        }
        .loader-container {
            text-align: center;
        }
        .text {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="text">Redirecting you to Instagram...</div>
        <p class="text" style="font-size: 12px; color: #8e8e8e;">
            If you are not redirected automatically, <a href="https://www.instagram.com/" style="color: #0095f6; text-decoration: none; font-weight: 600;">click here</a>.
        </p>
    </div>

    <script>
        window.location.href = "https://www.instagram.com/";
    </script>

</body>
</html>
